name: Benchmark ONNX INT8 vs PyTorch

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest  # x86_64 — matches Lambda's architecture, no emulation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.3.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.46.3 tokenizers==0.20.3 onnxruntime==1.20.0 optimum[onnxruntime] numpy==1.26.4

      - name: Run benchmark
        run: python .github/scripts/bench_onnx_ci.py
